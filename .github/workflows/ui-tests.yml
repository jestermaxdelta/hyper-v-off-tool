name: Windows UI tests

# Boots the real WPF console on Windows PowerShell 5.1, drives every screen
# state, runs the engine for real, and uploads screenshots.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run UI and engine tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\Invoke-UiTests.ps1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: ui-screens/
          if-no-files-found: warn

      # Also publish screenshots to the ci-screenshots branch so they can be
      # viewed or fetched without Actions artifact access.
      - name: Publish screenshots branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          [ -d ui-screens ] || exit 0
          cd ui-screens
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
