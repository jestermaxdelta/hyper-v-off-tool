name: Release

# Builds a customer-only ZIP and publishes it as a GitHub Release.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for example v2.0.0)'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3 (got '$REQUESTED')."
            exit 1
          fi
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        id: build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          name="HyperV-Off-Tool-$TAG"
          mkdir -p "dist/$name"
          cp outputs/Start-HyperV-Off-Console.cmd \
             outputs/HyperV-Off-Console.ps1 \
             outputs/Disable-HyperV-Fully.ps1 \
             "dist/$name/"
          cp outputs/README-HyperV-Off-Console.md "dist/$name/README.md"

          # Stamp the version shown in the app's Help sheet and support details.
          console="dist/$name/HyperV-Off-Console.ps1"
          sed -i "s/^\$script:AppVersion = 'dev'/\$script:AppVersion = '$TAG'/" "$console"
          grep -q "^\$script:AppVersion = '$TAG'" "$console" || { echo "::error::Version stamp failed."; exit 1; }

          # The launcher must keep Windows line endings.
          grep -q $'\r$' "dist/$name/Start-HyperV-Off-Console.cmd" || { echo "::error::Launcher lost its CRLF line endings."; exit 1; }

          (cd dist && zip -r -X "$name.zip" "$name")
          hash=$(sha256sum "dist/$name.zip" | cut -d' ' -f1)
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"
          echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          echo "sha=$hash" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > notes.md <<NOTES
          ## Download

          Download **${{ steps.build.outputs.file }}** below, then:

          1. Right-click the ZIP, choose **Extract All**, and open the extracted folder.
          2. Double-click **Start-HyperV-Off-Console.cmd** and approve the administrator prompt.
          3. Follow **What to do now** on the Home page, then click **Turn off Hyper-V** and confirm.

          Make sure you know your Windows account **password** first: PIN sign-in is turned off.
          The PC may restart up to twice. If a Microsoft confirmation screen appears at startup, press the key it shows (usually **F3**).

          ## Verify the download

          SHA-256: \`${{ steps.build.outputs.sha }}\`

          In PowerShell: \`Get-FileHash .\\${{ steps.build.outputs.file }}\`
          NOTES

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hyper-V Off Tool ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: ${{ steps.build.outputs.zip }}
          make_latest: true
